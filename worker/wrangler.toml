# kS ELO 관리자 서버 (클라우드플레어 워커)
# 깃허브 자동실행(deploy.yml)이 CLOUDFLARE_API_TOKEN 으로 올린다.
name = "ks-elo-api"
main = "src/index.js"
compatibility_date = "2026-01-01"
workers_dev = true

# 보관함(KV) 'ks-elo-data' — ID 는 배포할 때 tools/kvns.sh 가 찾아서(없으면 만들어서) 아래에 채운다.
#  'elo:*' : 시트 목록, 입력된 결과, 경기 수정, 등급조정 설정, 카페 설정, 로그인 출입증
[[kv_namespaces]]
binding = "KSDATA"
id = "__KV_ID__"
