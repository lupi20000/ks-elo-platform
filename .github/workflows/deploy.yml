# 사이트 + 관리자 서버를 클라우드플레어에 올린다.
#
# 필요한 것 (저장소 Settings → Secrets and variables → Actions 에 한 번만 넣으면 됨)
#   CLOUDFLARE_API_TOKEN  : 클라우드플레어 API 토큰 (Workers 편집 + Pages 편집 + KV 편집 권한)
#   CLOUDFLARE_ACCOUNT_ID : 클라우드플레어 계정 ID
#   GH_ACTIONS_TOKEN      : (선택) 깃허브 열쇠 — 운영진 화면 [적용]이 바로 빠른 갱신을 돌리게 함
#                           이 저장소만, 권한 'Actions: Read and write' 인 fine-grained 토큰
# 둘 중 하나라도 없으면 아무것도 안 하고 "설정이 필요합니다" 만 남기고 끝난다.
#
# 올리기 전에 하는 일 (복제 방지)
#   - app.js 를 사람이 읽기 어렵게 바꾼다(난독화)
#   - data.json 을 그대로 두지 않고 암호처럼 섞어서 d.bin 으로 바꾼다
#   - AI 수집 로봇 차단(robots.txt), 검색·AI 학습 금지 머리표(_headers)
name: 사이트 배포

on:
  push:
    branches: [main]
    paths: ['site/**', 'worker/**', 'tools/pack.mjs', '.github/workflows/deploy.yml']
  workflow_dispatch:
  workflow_call:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_ACTIONS_TOKEN: ${{ secrets.GH_ACTIONS_TOKEN }}
    steps:
      - name: 설정 확인
        id: chk
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::클라우드플레어 설정(CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID)이 아직 없어서 배포를 건너뜁니다."
            echo "go=0" >> "$GITHUB_OUTPUT"
          else
            echo "go=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.chk.outputs.go == '1'
        with:
          ref: main

      - uses: actions/setup-node@v4
        if: steps.chk.outputs.go == '1'
        with:
          node-version: '20'

      - name: 관리자 서버 올리기
        if: steps.chk.outputs.go == '1'
        run: |
          KV=$(bash tools/kvns.sh)
          sed -i "s/__KV_ID__/$KV/" worker/wrangler.toml
          cd worker && npx --yes wrangler@3 deploy
          if [ -n "$GH_ACTIONS_TOKEN" ]; then
            printf '%s' "$GH_ACTIONS_TOKEN" | npx --yes wrangler@3 secret put GH_TOKEN >/dev/null && echo "깃허브 열쇠 넣음(바로 반영 켜짐)"
          else
            echo "::notice::GH_ACTIONS_TOKEN 이 없어 운영진 [적용]의 바로 반영은 꺼져 있습니다 (매일 아침 반영)."
          fi

      - name: 사이트 묶기 (난독화 · 데이터 섞기)
        if: steps.chk.outputs.go == '1'
        run: |
          npm i --no-save javascript-obfuscator@4.1.1 csso@5.0.5 >/dev/null
          node tools/pack.mjs

      - name: 사이트 올리기
        if: steps.chk.outputs.go == '1'
        run: |
          npx --yes wrangler@3 pages project create ks-clan-elo --production-branch main >/dev/null 2>&1 || true
          npx --yes wrangler@3 pages deploy dist --project-name ks-clan-elo --branch main --commit-dirty=true
