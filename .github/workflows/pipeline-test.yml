name: 파이프라인 시험(임시)
on:
  push:
    branches: [pipeline]
    paths: ['.github/workflows/pipeline-test.yml']
  workflow_dispatch:
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: 카페 결과입력란
        run: |
          python3 - <<'PY'
          import json, urllib.request, datetime
          def get(u):
              return urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0","Referer":"https://cafe.naver.com/"}),timeout=60).read().decode()
          ids=[]
          for p in range(1,4):
              d=json.loads(get(f"https://apis.naver.com/cafe-web/cafe2/ArticleListV2dot1.json?search.clubid=30800617&search.menuid=71&search.page={p}&search.perPage=50"))
              r=d["message"]["result"]; print("page",p,len(r["articleList"]),r.get("hasNext"))
              for a in r["articleList"]:
                  ids.append(a["articleId"])
                  print(a["articleId"], datetime.datetime.fromtimestamp(a["writeDateTimestamp"]/1000).strftime("%Y-%m-%d"), "|", a["writerNickname"], "|", a["subject"], "|", a.get("headName"), a.get("commentCount"))
          for i in ids[:2]:
              try:
                  t=get(f"https://apis.naver.com/cafe-web/cafe-articleapi/v2.1/cafes/30800617/articles/{i}?useCafeId=true")
                  print("본문", i, t[:1500])
              except Exception as e: print("본문 실패", i, e)
          PY
