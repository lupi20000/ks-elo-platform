name: 파이프라인 시험(임시)
on:
  push:
    branches: [pipeline]
    paths: ['.github/workflows/pipeline-test.yml', 'build.py', 'tools/*.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy
      - name: 1) 기본 빌드(카페·등록시트 없이)
        run: python build.py && cp site/data.json /tmp/data1.json && cp 검증-리포트.md /tmp/report1.md
      - name: 요약
        run: |
          python - <<'PY'
          import json
          d=json.load(open('site/data.json',encoding='utf-8'))
          print("games",d['meta']['games'],"players",d['meta']['players'],"srcs",d['srcs'])
          for s in d['meta']['sources']: print(" ",s['name'],s['status'],s['rows'])
          k=d.get('kpl')
          if not k: print("kpl 없음"); raise SystemExit
          print("season",k['season'],k['updated'])
          for s in k['standings']: print(" ",s)
          print("teams",[(t['name'],len(t['members']),sum(1 for m in t['members'] if m['k'])) for t in k['teams']])
          print("ranking",len(k['ranking']),k['ranking'][:2], "k없음", [r['id'] for r in k['ranking'] if not r['k']][:20])
          ms=k['matches']; print("matches",len(ms),"played",sum(m['played'] for m in ms),"with sets",sum(1 for m in ms if m['sets']))
          print(json.dumps(ms[0],ensure_ascii=False)[:2500])
          print([ (m['stage'],m['no'],m['date'],m['home'],m['away'],m['hs'],m['as'],len(m['sets'])) for m in ms])
          nok=[(s['w'],s['l']) for m in ms for s in m['sets'] if not (s['wk'] and s['lk'])]; print("세트 k없음",nok[:20])
          PY
      - name: 2) 시트 매핑 짐작
        run: python tools/analyze_sheet.py "https://docs.google.com/spreadsheets/d/1inAFXKnerFZm-k0OJwh4XgBA8yWVHRWD2kh8v4XDs2g/edit#gid=509675759" | tee /tmp/an.txt
      - name: 3) 카페 + 등록시트 빌드(중복 제거 확인)
        run: |
          echo '{"enabled":true,"clubid":30800617,"menuid":71}' > /tmp/cafe.json
          python - <<'PY'
          import json
          m=json.loads(open('/tmp/an.txt',encoding='utf-8').readline())
          json.dump([{"id":"kpltest","name":"KPL 시험","league":"KPL","weight":3.5,"url":"https://docs.google.com/spreadsheets/d/1inAFXKnerFZm-k0OJwh4XgBA8yWVHRWD2kh8v4XDs2g/edit#gid=509675759","enabled":True,"mapping":m},
                     {"id":"bad","name":"비공개","league":"ELO","url":"https://docs.google.com/spreadsheets/d/1SsC2NgMxva_SeS1Xo84kha41pT2bIUoZRXMGbmOxb8o/edit","enabled":True,"mapping":m}],open('/tmp/src.json','w'),ensure_ascii=False)
          PY
          ELO_CAFE_FILE=/tmp/cafe.json python tools/cafe.py
          ELO_SOURCES_FILE=/tmp/src.json python build.py
          python - <<'PY'
          import json
          st=json.load(open('out/srcstat.json',encoding='utf-8'))
          for k,v in st.items():
              u=v.pop('unparsed',None); print(k,v)
              if u: print("  못읽음",len(u),u[:8])
          g=json.load(open('out/cafe_games.json',encoding='utf-8'))['games']; print("카페 세트",len(g)); [print(" ",x['date'],x['winner'],'>',x['loser'],x['articleId']) for x in g[:25]]
          d=json.load(open('site/data.json',encoding='utf-8')); print("games",d['meta']['games'],"srcs",d['srcs'])
          PY
      - name: 기본 빌드 결과 되돌려 놓고 올리기
        run: |
          cp /tmp/data1.json site/data.json
          git config user.name "ks-elo-bot"; git config user.email "ks-elo-bot@users.noreply.github.com"
          git add site/data.json
          git diff --cached --quiet || { printf "시험 빌드: 실제 시트로 만든 data.json (KPL 묶음 포함)\n\nCo-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>\nClaude-Session: https://claude.ai/code/session_01741mptAL5B4zATwR9gvHKL\n" > /tmp/msg; git commit -q -F /tmp/msg; git push; git log -1 --format=%H; }
      - uses: actions/upload-artifact@v4
        with:
          name: data-json
          path: |
            /tmp/data1.json
            /tmp/report1.md
            out/srcstat.json
